# render.yaml — Configuración de deploy automático en Render.com
#
# Uso: conecta este repo en render.com → "New Web Service" → detecta este archivo.
# Variables marcadas con sync: false DEBEN configurarse manualmente en el dashboard.
#
# Documentación completa: ver DEPLOY_RENDER.md

services:
  - type: web
    name: perfuteca-api
    env: python
    region: oregon          # US-West — menor latencia a Perú desde Render free tier
    plan: free              # Free tier: 512 MB RAM, spin-down tras 15 min inactivo
    pythonVersion: "3.12.4" # Fijar versión exacta — evita sorpresas si Render actualiza default
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      # ── Obligatorias (configurar manualmente en Render dashboard) ─────────────
      - key: GCP_SERVICE_ACCOUNT
        sync: false          # Pegar el JSON completo de credenciales.json

      - key: API_KEY
        sync: false          # Clave secreta para endpoints de ventas/cotizaciones
                             # Ejemplo: una cadena aleatoria de 32+ caracteres

      # ── Opcionales ─────────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: "*"           # Cambiar por URL de Flutter en producción

      - key: ENVIRONMENT
        value: production    # Activa advertencias de seguridad en logs
